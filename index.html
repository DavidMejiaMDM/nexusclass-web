<style>

.fld.lead input{padding-left:48px}.fld .lead{position:absolute;left:14px;top:16px;color:var(--ov)}.fld .trail{position:absolute;right:8px;top:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ov);cursor:pointer;border-radius:50%}

.fld select{padding-right:40px}.fld .dd{position:absolute;right:12px;top:16px;pointer-events:none;color:var(--ov)}
.form{display:flex;flex-direction:column;gap:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lbl{font-weight:500;margin-bottom:8px}
.er-box,.ok-box{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--erc);color:#1E293B}.er-box .ms{color:#DC2626}[data-theme=dark] .er-box{color:#E2E8F0}
.info-box{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--prc) 60%,transparent);font-size:12px}.info-box .ms{color:var(--pr)}
.fz{display:flex;gap:6px}.fz i{flex:1;height:5px;border-radius:3px;background:var(--olv)}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 4px;width:100%;text-align:left;border-radius:12px}button.setrow:hover{background:var(--sv)}.setrow .ico{width:40px;height:40px;border-radius:12px;background:var(--prc);color:var(--onprc);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.datum{padding:12px 0;border-bottom:1px solid var(--olv)}.datum:last-child{border:0}.datum .ov{font-size:12px}
/* pdf */
.drop{border:2px dashed var(--ol);border-radius:24px;padding:34px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:var(--sf)}.drop.dg,.drop:hover{border-color:var(--pr);background:var(--prc)}.drop .ms{font-size:44px;color:var(--pr)}
.step{display:flex;gap:12px;align-items:center;margin-top:12px}.step i{width:28px;height:28px;border-radius:50%;background:var(--prc);color:var(--onprc);font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 28px}
/* auth */
.auth{flex:1;position:relative;overflow:auto;background:linear-gradient(180deg,#004A98,#003366);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;color:#fff}
.auth .bc{position:absolute;border-radius:50%;background:rgba(255,255,255,var(--a));width:var(--d);height:var(--d);left:var(--x);top:var(--y);transform:translate(-50%,-50%);pointer-events:none}
.logo{border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}.logo.ring{box-shadow:0 0 0 10px rgba(255,255,255,.18)}
.acard{width:100%;max-width:440px;background:var(--sf);color:var(--on);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 32px rgba(0,0,0,.3);position:relative;animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}.acard .hm{text-align:center}.acard .sub{text-align:center;color:var(--ov)}
.lnk{width:100%;height:40px;border-radius:20px;color:var(--pr)}.lnk:hover{background:var(--sv)}.lnk b{font-weight:700}
.spin{width:36px;height:36px;border:3px solid var(--prc);border-top-color:var(--pr);border-radius:50%;animation:rot .8s linear infinite}.spin.w{border-color:rgba(255,255,255,.3);border-top-color:#fff}@keyframes rot{to{transform:rotate(360deg)}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:80px 20px}
.dots{display:flex;gap:8px;justify-content:center}.dots i{height:8px;width:8px;border-radius:4px;background:var(--olv);transition:.2s}.dots i.on{width:24px;background:var(--pr)}
.pg{animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateX(16px)}}
/* diálogo y aviso */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fi2 .15s}@keyframes fi2{from{opacity:0}}

<body>
<div id="app"></div><div id="toast"></div>
<script>
/* ===== Servidor: tu API en Render (se puede cambiar en el login, enlace «Servidor») ===== */
const DEFAULT_API = "https://organizador-api-g3vc.onrender.com";
const LS = { g: k => { try { return localStorage.getItem(k); } catch { return null; } }, s: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, d: k => { try { localStorage.removeItem(k); } catch {} } };
const base = () => (LS.g("nx_api") || DEFAULT_API).trim().replace(/\/+$/, "").replace(/\/api\/v1$/, "") + "/api/v1";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n, f) => `<span class="ms${f ? " f" : ""}">${n}</span>`;
const S = { token: LS.g("nx_token"), user: JSON.parse(LS.g("nx_user") || "null") };
const P = { tema: LS.g("nx_tema") || "SISTEMA", alertas: LS.g("nx_alertas") !== "0", horas: +(LS.g("nx_horas") || 24) };
const mq = matchMedia("(prefers-color-scheme: dark)");
const tema = () => document.documentElement.dataset.theme = (P.tema === "OSCURO" || (P.tema === "SISTEMA" && mq.matches)) ? "dark" : "light";
mq.addEventListener("change", tema); tema();
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 3000); }
window.addEventListener("unhandledrejection", e => { if (e.reason && !e.reason.mensaje) console.error(e.reason); });

/* ---------- formatos (igual que Formato.kt) ---------- */
const DIAS = ["LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO", "DOMINGO"];
const DN = { LUNES: "Lunes", MARTES: "Martes", MIERCOLES: "Miércoles", JUEVES: "Jueves", VIERNES: "Viernes", SABADO: "Sábado", DOMINGO: "Domingo" };
const DI = d => d === "MIERCOLES" ? "X" : d[0];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const F = {
  h12: s => { const [h, m] = String(s).split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "PM" : "AM"}`; },
  hd: d => F.h12(d.getHours() + ":" + d.getMinutes()),
  rango: (a, b) => `${F.h12(a)} - ${F.h12(b)}`,
  dur: m => m >= 60 && m % 60 === 0 ? `${m / 60} h` : m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`,
  larga: iso => cap(new Date(iso).toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" })),
  completa: iso => { const d = new Date(iso); return cap(d.toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).replace(",", "")) + ", " + F.hd(d); },
  tarea: iso => { const d = new Date(iso), n = new Date(), df = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
    return df === 0 ? "Hoy " + F.hd(d) : df === 1 ? "Mañana " + F.hd(d) : cap(d.toLocaleDateString("es-CO", { weekday: "short", day: "numeric", month: "short" }).replace(/[,.]/g, "")) + ", " + F.hd(d); },
  min: iso => Math.floor((new Date(iso) - Date.now()) / 6e4),
  rest: iso => { const m = F.min(iso); if (m < 0) return "Vencida"; if (m < 60) return `Quedan ${m} min`; if (m < 2880) { const h = Math.floor(m / 60), r = m % 60; return r ? `Quedan ${h} h ${r} min` : `Quedan ${h} h`; } const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); return h ? `Quedan ${d} d ${h} h` : `Quedan ${d} días`; },
  ubic: (s, e) => !s ? "Salón por confirmar" : e ? `Salón ${s} · ${e}` : `Salón ${s}`,
  tc: t => ({ PARCIAL: "#DC2626", TALLER: "#4F46E5" }[String(t).toUpperCase()] || "#0284C7"),
  ini: n => ((n || "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase()) || "UA",
  pad: n => String(n).padStart(2, "0"),
  bog: () => { const s = new Date().toLocaleString("en-US", { timeZone: "America/Bogota", hour12: false, weekday: "long", hour: "2-digit", minute: "2-digit" }).split(/[ ,:]+/); const dia = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"].indexOf(s[0].toUpperCase()); return { dia: DIAS[dia], min: (+s[1] % 24) * 60 + +s[2] }; }
};
const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

async function api(path, { method = "GET", body, form } = {}) {
  const h = {}; if (S.token) h.Authorization = "Bearer " + S.token; if (body) h["Content-Type"] = "application/json";
  let r;
  for (let i = 0; i < 3; i++) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 70000);
    try { r = await fetch(base() + path, { method, headers: h, signal: ctl.signal, body: form || (body ? JSON.stringify(body) : undefined) }); clearTimeout(to); break; }
    catch { clearTimeout(to); if (i === 2) throw { mensaje: "No se pudo conectar con el servidor. Si estaba dormido, espera un momento y reintenta." }; await new Promise(f => setTimeout(f, 3000)); }
  }
  if (r.status === 204) return null;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && S.token && !path.startsWith("/auth/")) { salir(true); } throw { ...j, mensaje: j.mensaje || j.error || "Ocurrió un error (" + r.status + ")" }; }
  return j;
}

  if (ed) $("#del").onclick = () => dialog({ t: "¿Eliminar esta asignatura?", x: "También se eliminarán todas sus tareas. Esta acción no se puede deshacer.", ok: "Eliminar", danger: 1, onOk: async () => { try { await api("/clases/" + c._id, { method: "DELETE" }); toast("Asignatura eliminada"); go("/horario"); } catch (x) { toast(x.mensaje); } } });
  $("#f").onsubmit = async e => { e.preventDefault(); const d = val(e.target), er = {}; if (!d.nombreMateria.trim()) er.nombreMateria = "Escribe el nombre de la materia"; errs(e.target, er);
    let eh = ""; if (H.some(h => !h.horaInicio || !h.horaFin)) eh = "Completa la hora de inicio y fin de cada horario."; else if (H.some(h => h.horaFin <= h.horaInicio)) eh = "La hora de fin debe ser después de la de inicio."; $("#eh").hidden = !eh; $("#eh").textContent = eh; if (eh || Object.keys(er).length) return;
    const body = { nombreMateria: d.nombreMateria.trim(), docente: d.docente.trim(), salon: d.salon.trim(), edificio: d.edificio.trim(), horarios: H.map(h => ({ diaSemana: h.diaSemana, horaInicio: h.horaInicio, horaFin: h.horaFin })) }; if (!ed) body.color = COL[Math.floor(Math.random() * COL.length)];
    const b = $(".btn", e.target); b.disabled = true;
    try { const r = await api(ed ? "/clases/" + c._id : "/clases", { method: ed ? "PUT" : "POST", body }); toast(ed ? "Cambios guardados" : "Asignatura guardada"); go("/clase/" + (r._id || c?._id || "")); } catch (x) { b.disabled = false; $("#eg").innerHTML = errBox(x.mensaje); } };
}
let PDF = { file: null, fase: "ninguno", rep: false, res: null, err: "" };
function vCarga({ primera }) {
  const v = shell("horario"); v.className = "wrap nar"; if (PDF.fase === "listo" || PDF.fase === "subiendo") PDF = { file: null, fase: "ninguno", rep: false, res: null, err: "" };
  const paint = () => { const f = PDF.file, ico = f ? "picture_as_pdf" : "upload_file";
    v.innerHTML = bar("Cargar horario", primera ? `<button class="btn t" data-go="/hoy">Omitir</button>` : "") + `<div class="col" style="gap:16px"><div><h2 class="hm">Sube tu horario</h2><div class="bl ov" style="margin-top:6px">Descarga el PDF de tu horario académico desde Moodle y la app extraerá tus asignaturas, días, horas y salones.</div></div>
    ${PDF.fase === "subiendo" ? `<div class="card center" style="padding:40px"><div class="spin"></div><div class="tm">Extrayendo asignaturas, días, horas y salones…</div><div class="ov">La primera vez puede tardar hasta 1 minuto mientras el servidor despierta.</div></div>`
    : PDF.fase === "listo" ? `<div class="card msg">${ic("check_circle", 1)}<div class="tm">¡Listo! Se encontraron ${PDF.res.total} clases</div><div class="ov">${PDF.res.creadas ?? PDF.res.total} nuevas · ${PDF.res.omitidas ?? 0} ya estaban en tu horario</div><button class="btn" style="margin-top:12px" data-go="/revision">Revisar clases</button></div>`
    : `<div class="drop" id="dz">${ic(ico)}<div class="tm">${f ? esc(f.name) : "Toca aquí o arrastra tu horario"}</div><div class="ov">${f ? Math.round(f.size / 1024) + " KB · Listo para subir" : "Archivo PDF descargado de Moodle (máx. 5 MB)"}</div><input type="file" id="fi" accept="application/pdf" hidden></div>${PDF.err ? errBox(PDF.err) : ""}
    <div class="card r g12"><div class="fx"><div class="tm">Reemplazar mi horario actual</div><div class="bs ov">Borra las clases y tareas actuales. Úsalo al empezar un semestre nuevo.</div></div><button class="sw ${PDF.rep ? "on" : ""}" id="rp"></button></div>
    <div class="r g12"><button class="btn bl fx" id="up" ${f ? "" : "disabled"}>${ic("cloud_upload")}Subir y procesar</button>${f ? `<button class="btn o" style="height:52px" id="cf">Cambiar archivo</button>` : `<button class="btn o" style="height:52px" id="cf">Seleccionar PDF de Moodle</button>`}</div>`}
    <div class="card"><div class="tm">Guía rápida</div>${["Descarga tu horario académico en PDF desde Moodle.", "Selecciónalo aquí y pulsa «Subir y procesar».", "Revisa las clases detectadas y corrige lo que haga falta."].map((s, i) => `<div class="step"><i>${i + 1}</i><div>${s}</div></div>`).join("")}</div></div>`;
    if (PDF.fase === "subiendo" || PDF.fase === "listo") return; const fi = $("#fi"), pick = f => { if (!f) return; if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") { PDF.err = "El archivo debe ser un PDF."; PDF.file = null; } else if (f.size > 5 * 1024 * 1024) { PDF.err = "El PDF pesa más de 5 MB."; PDF.file = null; } else { PDF.err = ""; PDF.file = f; PDF.fase = "seleccionado"; } paint(); };
    $("#dz").onclick = () => fi.click(); fi.onchange = () => pick(fi.files[0]); $("#cf").onclick = () => fi.click(); $("#rp").onclick = () => { PDF.rep = !PDF.rep; paint(); };
    const dz = $("#dz"); ["dragenter", "dragover"].forEach(n => dz.addEventListener(n, e => { e.preventDefault(); dz.classList.add("dg"); })); ["dragleave", "drop"].forEach(n => dz.addEventListener(n, e => { e.preventDefault(); dz.classList.remove("dg"); })); dz.addEventListener("drop", e => pick(e.dataTransfer.files[0]));
    $("#up").onclick = async () => { const fd = new FormData(); fd.append("pdf", PDF.file); PDF.fase = "subiendo"; paint(); try { PDF.res = await api("/clases/upload" + (PDF.rep ? "?reemplazar=true" : ""), { method: "POST", form: fd }); PDF.fase = "listo"; } catch (x) { PDF.fase = "seleccionado"; PDF.err = x.mensaje; } paint(); }; };
  paint();
}
async function vRevision(_, ok) {
  const v = shell("horario"); v.className = "wrap mid"; v.innerHTML = load("Cargando tus clases…"); const cl = await api("/clases"); if (!ok()) return; const raro = h => +h.slice(-2) % 5 !== 0;
  v.innerHTML = bar("Revisar clases") + `<h2 class="hm">${cl.length} clases detectadas</h2><div class="ov" style="margin:6px 0 20px">Verifica salones, docentes y horas. Toca una clase para corregirla.</div>` + (cl.length ? `<div class="cards">${cl.map(c => { const du = (c.horarios || []).some(h => raro(h.horaInicio) || raro(h.horaFin)), ss = !c.salon; return `<div class="card click r g12" style="${du ? "border-color:var(--amb)" : ""}" data-go="/editar-clase?claseId=${c._id}"><div class="bar4" style="background:${esc(c.color || "#004A98")}"></div><div class="fx col" style="gap:2px"><div class="tm">${esc(c.nombreMateria)}</div><div class="bs ov">${esc(c.docente || "Docente por confirmar")}</div>${(c.horarios || []).map(h => `<div class="bs">${DN[h.diaSemana].slice(0, 3)} · ${F.rango(h.horaInicio, h.horaFin)}</div>`).join("")}${du || ss ? `<div class="r g8" style="margin-top:4px">${du ? chipT("Revisa las horas", "#B45309") : ""}${ss ? chipT("Sin salón", "#B45309") : ""}</div>` : ""}</div>${ic("edit")}</div>`; }).join("")}</div>` : msgCard("event_busy", "No hay clases todavía", "Sube el PDF de Moodle o agrega una clase manualmente."))
    + `<div class="r g12" style="margin-top:24px;flex-wrap:wrap"><button class="btn o" data-go="/editar-clase">${ic("add")}Agregar clase manualmente</button><span class="sp"></span><button class="btn" data-go="/hoy">Confirmar y continuar</button></div>`;
}

/* ---------- notificaciones, ajustes, perfil ---------- */
async function vNotif(_, ok) {
  const v = shell("hoy"); v.className = "wrap nar"; v.innerHTML = load("Buscando alertas…"); const ts = (await api("/tasks?estado=pendiente")).sort((a, b) => new Date(a.fechaEntrega) - new Date(b.fechaEntrega)); if (!ok()) return;
  const venc = ts.filter(t => F.min(t.fechaEntrega) < 0), prox = ts.filter(t => { const m = F.min(t.fechaEntrega); return m >= 0 && m <= P.horas * 60; });
  v.innerHTML = bar("Notificaciones") + `<h2 class="hm">Alertas</h2><div class="ov" style="margin:6px 0 20px">Entregas que vencen en las próximas ${P.horas} horas</div>` + (!venc.length && !prox.length ? msgCard("notifications_off", "Sin alertas", `No tienes entregas por vencer en las próximas ${P.horas} horas.`) :
    (venc.length ? `<div class="tm" style="color:var(--er);margin-bottom:10px">Vencidas (${venc.length})</div><div class="col" style="gap:12px;margin-bottom:24px">${venc.map(t => tcard(t)).join("")}</div>` : "") + (prox.length ? `<div class="tm" style="margin-bottom:10px">Por vencer (${prox.length})</div><div class="col" style="gap:12px">${prox.map(t => tcard(t)).join("")}</div>` : ""));
}
function vAjustes() {
  const v = shell("ajustes"); v.className = "wrap nar"; const u = S.user || {}, row = (i, t, s, a, extra = "") => `<button class="setrow" ${a}><span class="ico">${ic(i)}</span><span class="fx"><div class="tm">${t}</div>${s ? `<div class="bs ov">${s}</div>` : ""}</span>${extra || ic("chevron_right")}</button>`, sec = t => `<div class="ls pr" style="margin:26px 0 6px">${t}</div>`;
  v.innerHTML = `<h1 class="hm" style="margin-bottom:20px">Ajustes</h1><div class="card r g12" style="padding:20px"><span class="av" style="width:56px;height:56px;font-size:20px">${F.ini(u.nombre)}</span><div class="fx"><div class="tm">${esc(u.nombre || "Estudiante")}</div><div class="ov" style="overflow:hidden;text-overflow:ellipsis">${esc(u.email || "")}</div></div><button class="btn o" data-go="/perfil">Editar nombre y contraseña</button></div>
  ${sec("Horario")}${row("upload_file", "Actualizar horario", "Sube un nuevo PDF de Moodle", 'data-go="/carga"')}${row("add", "Agregar clase manualmente", "", 'data-go="/editar-clase"')}
  ${sec("Notificaciones")}<div class="setrow"><span class="fx"><div class="tm">Alertas de entregas</div><div class="bs ov">Te avisamos antes de que venza una tarea o parcial.</div></span><button class="sw ${P.alertas ? "on" : ""}" id="sa"></button></div>
  <div style="padding:8px 4px"><div class="tm" style="margin-bottom:10px">Avisarme con anticipación de</div><div class="chips">${[3, 12, 24, 48].map(h => `<button class="fc ${P.horas === h ? "on" : ""}" data-h="${h}">${h} h</button>`).join("")}</div></div>
  ${sec("Apariencia")}<div style="padding:8px 4px"><div class="tm" style="margin-bottom:10px">Tema</div><div class="chips">${[["SISTEMA", "Sistema"], ["CLARO", "Claro"], ["OSCURO", "Oscuro"]].map(([k, t]) => `<button class="fc ${P.tema === k ? "on" : ""}" data-th="${k}">${t}</button>`).join("")}</div></div>
  ${sec("Cuenta")}${row("info", "Acerca de la app", "", 'id="ab"')}${row("logout", "Cerrar sesión", "", 'id="lo"')}<button class="setrow" id="dl"><span class="ico" style="background:var(--erc);color:var(--er)">${ic("delete_forever")}</span><span class="fx"><div class="tm" style="color:var(--er)">Eliminar mi cuenta</div><div class="bs ov">Borra tu cuenta, tus clases y tus tareas</div></span></button>`;
  $("#sa").onclick = e => { P.alertas = !P.alertas; LS.s("nx_alertas", P.alertas ? "1" : "0"); e.currentTarget.classList.toggle("on", P.alertas); };
  $$("[data-h]").forEach(b => b.onclick = () => { P.horas = +b.dataset.h; LS.s("nx_horas", P.horas); $$("[data-h]").forEach(x => x.classList.toggle("on", x === b)); });
  $$("[data-th]").forEach(b => b.onclick = () => { P.tema = b.dataset.th; LS.s("nx_tema", P.tema); tema(); $$("[data-th]").forEach(x => x.classList.toggle("on", x === b)); });
  $("#ab").onclick = () => dialog({ t: "Organizador UA", x: "Organizador Inteligente de Clases y Tareas NexusClass\nVersión 1.3.0 (web)\n\nDesarrollado por Marcos David Mejía Escobar\nDocente: Zulema León\nCorporación Universitaria Autónoma del Cauca", ok: "Cerrar", cancel: "" });
  $("#lo").onclick = () => dialog({ t: "¿Cerrar sesión?", x: "Tus datos siguen guardados. Podrás volver a entrar con tu correo y contraseña.", ok: "Cerrar sesión", onOk: () => salir() });
  $("#dl").onclick = () => dialog({ t: "¿Eliminar tu cuenta?", x: "Se borrarán tu cuenta, tus clases y tus tareas. Esta acción no se puede deshacer.", ok: "Eliminar", danger: 1, onOk: async () => { try { await api("/auth/me", { method: "DELETE" }); toast("Cuenta eliminada"); salir(); } catch (x) { toast(x.mensaje); } } });
}
function vPerfil() {
  const v = shell("ajustes"); v.className = "wrap nar"; const u = S.user || {};
  v.innerHTML = bar("Mi perfil") + `<div class="col" style="gap:24px"><div class="r g12"><span class="av" style="width:72px;height:72px;font-size:26px">${F.ini(u.nombre)}</span><div><div class="tl">${esc(u.nombre)}</div><div class="ov">${esc(u.email)}</div></div></div>
  <form id="fn" class="card form" novalidate><div class="tm">Datos personales</div>${fld({ n: "nombre", l: "Nombre", v: u.nombre })}<div class="fld fix"><input value="${esc(u.email)}" disabled><label>Correo institucional</label><div class="sup" data-h="El correo no se puede cambiar.">El correo no se puede cambiar.</div></div><div><button class="btn">Guardar nombre</button></div></form>
  <form id="fp" class="card form" novalidate><div class="tm">Cambiar contraseña</div>${fld({ n: "passwordActual", l: "Contraseña actual", t: "password", pw: 1 })}${fld({ n: "passwordNueva", l: "Nueva contraseña", t: "password", pw: 1, h: "Mínimo 8 caracteres" })}<div id="fz"></div>${fld({ n: "confirmar", l: "Repite la nueva contraseña", t: "password", pw: 1 })}<div class="bs ov">Al cambiarla se cerrarán tus otras sesiones; en este navegador seguirás dentro.</div><div id="eg"></div><div><button class="btn">Cambiar contraseña</button></div></form></div>`;
  $("[name=passwordNueva]").oninput = e => $("#fz").innerHTML = strengthHtml(e.target.value);

    try { sesion(await api("/auth/password", { method: "PUT", body: { passwordActual: d.passwordActual, passwordNueva: d.passwordNueva } })); toast("Contraseña actualizada"); e.target.reset(); $("#fz").innerHTML = ""; } catch (x) { if (["passwordActual", "passwordNueva"].includes(x.campo)) errs(e.target, { [x.campo]: x.mensaje }); else $("#eg").innerHTML = errBox(x.mensaje); } };

/* ---------- eventos globales ---------- */
document.addEventListener("click", async e => {
  const pw = e.target.closest("[data-pw]"); if (pw) { const i = pw.parentElement.querySelector("input"); i.type = i.type === "password" ? "text" : "password"; pw.textContent = i.type === "password" ? "visibility" : "visibility_off"; return; }
  if (e.target.closest("[data-tg]")) return;
  const dn = e.target.closest("[data-done]"); if (dn) { e.stopPropagation(); try { await completar(dn.dataset.done, true); toast("¡Tarea completada!"); route(); } catch (x) { toast(x.mensaje); } return; }
  if (e.target.closest("[data-back]")) return back();
  const g = e.target.closest("[data-go]"); if (g) { if (g.disabled) return; const to = g.dataset.go; if ("#" + to === location.hash) route(); else go(to); }
});
document.addEventListener("change", async e => { const c = e.target.closest("[data-tg]"); if (!c) return; try { await completar(c.dataset.tg, c.checked); const t = TD.find(x => x._id === c.dataset.tg); if (t) t.completada = c.checked; toast(c.checked ? "¡Tarea completada!" : "Tarea marcada como pendiente"); route(); } catch (x) { c.checked = !c.checked; toast(x.mensaje); } });
route();
</script>
